<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="48%"  stop-color="#b45309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#080d1a"  stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- night sky background -->
  <rect width="32" height="32" rx="6" fill="#080d1a"/>

  <!-- ambient lamp glow across the sky -->
  <rect width="32" height="32" rx="6" fill="url(#glow)"/>

  <!-- city silhouette — left cluster -->
  <rect x="0"  y="21" width="4"  height="11" fill="#040810"/>
  <rect x="5"  y="18" width="3"  height="14" fill="#040810"/>
  <rect x="9"  y="20" width="4"  height="12" fill="#040810"/>

  <!-- city silhouette — right cluster (gap x=13–19 for lamp post) -->
  <rect x="19" y="20" width="4"  height="12" fill="#040810"/>
  <rect x="24" y="17" width="3"  height="15" fill="#040810"/>
  <rect x="28" y="21" width="4"  height="11" fill="#040810"/>

  <!-- lamp post -->
  <rect x="15.5" y="13" width="1.5" height="9" rx="0.5" fill="#4b5563"/>

  <!-- glow halos (largest → smallest) -->
  <circle cx="16" cy="11.5" r="7"   fill="#f59e0b" opacity="0.13"/>
  <circle cx="16" cy="11.5" r="4.5" fill="#fbbf24" opacity="0.42"/>
  <circle cx="16" cy="11.5" r="3"   fill="#fde68a" opacity="0.88"/>

  <!-- bright lamp core -->
  <circle cx="16" cy="11.5" r="1.8" fill="#fffbeb"/>
</svg>
